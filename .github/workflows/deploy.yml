name: Deploy NASE-842 Frontend

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: frontend-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: us-east-1
      S3_BUCKET: nase842-frontend-253650698585-us-east-1
      CLOUDFRONT_ID: E1OM9BJGPLKLJ7

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Vue application
        run: pnpm build

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::253650698585:role/nase842-github-frontend-deploy
          aws-region: us-east-1

      - name: Verify AWS account
        run: |
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          test "$ACCOUNT" = "253650698585"

      - name: Upload frontend assets to S3
        run: |
          aws s3 sync dist/ "s3://$S3_BUCKET/" \
            --delete \
            --exclude "index.html"

      - name: Upload index.html with no-cache
        run: |
          aws s3 cp dist/index.html "s3://$S3_BUCKET/index.html" \
            --content-type "text/html" \
            --cache-control "no-cache"

      - name: Invalidate CloudFront cache
        run: |
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_ID" \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text)

          aws cloudfront wait invalidation-completed \
            --distribution-id "$CLOUDFRONT_ID" \
            --id "$INVALIDATION_ID"

          echo "Frontend deployment completed successfully!"
