name: Deploy NASE-842 Frontend (Ireland)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: nase842-frontend-ireland
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    env:
      AWS_REGION: eu-west-1
      AWS_ACCOUNT_ID: "253650698585"
      S3_BUCKET: nase842-frontend-rebuild-253650698585-eu-west-1
      CLOUDFRONT_ID: E3TD8SX401FEWB
      VITE_API_HOST: https://ezes0o2ub8.execute-api.eu-west-1.amazonaws.com
      SITE_URL: https://dvqn80eroo0tk.cloudfront.net

    steps:
      - name: Checkout Vue application
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Ireland frontend
        run: |
          pnpm build
          test -f dist/index.html

      - name: Authenticate to AWS with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::253650698585:role/nase842-github-frontend-deploy-eu
          aws-region: eu-west-1

      - name: Verify Ireland AWS target
        run: |
          set -euo pipefail
          ACCOUNT="$(aws sts get-caller-identity --query Account --output text)"
          test "$ACCOUNT" = "$AWS_ACCOUNT_ID"
          aws s3api head-bucket --bucket "$S3_BUCKET"

      - name: Upload static assets to Ireland S3
        run: |
          aws s3 sync dist/ "s3://$S3_BUCKET/" \
            --delete --exclude "index.html"
          aws s3 cp dist/index.html "s3://$S3_BUCKET/index.html" \
            --content-type "text/html" \
            --cache-control "no-cache"

      - name: Invalidate Ireland CloudFront
        run: |
          set -euo pipefail
          INVALIDATION_ID="$(aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_ID" \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text)"
          aws cloudfront wait invalidation-completed \
            --distribution-id "$CLOUDFRONT_ID" \
            --id "$INVALIDATION_ID"

      - name: Verify Ireland website
        run: |
          curl --fail --silent --show-error \
            --retry 6 --retry-delay 5 --retry-all-errors \
            --output /dev/null "$SITE_URL/"
          echo "Ireland frontend health check passed."
